<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bremen Town Musicians Interactive Story</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lecturer QA: Website/local host answer.
      This HTML file is the local website shell. When the project folder is served through localhost,
      the browser loads this page, the CSS, p5.js, p5.sound, and the local sketch.js file below.
      Localhost matters because browser APIs such as asset loading and Web Serial work reliably from
      a proper local web origin instead of only dragging files into the browser.
      Values: p5 version 1.9.4 is loaded from CDN, and sketch.js contains the actual interactive code. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"></script>
  </head>
  <body>
    <main id="app" aria-label="Bremen Town Musicians interactive story">
      <div id="canvas-wrap"></div>
      <section id="hud" aria-live="polite">
        <div class="status-row">
          <!-- Lecturer QA: Arduino UI button answer.
            This button is not decorative; sketch.js finds id="connect-serial" in setup() and attaches
            a click listener that calls connectSerial(). That function opens the USB-connected Arduino
            Micro through the browser Web Serial permission popup. -->
          <button id="connect-serial" type="button">Connect Arduino</button>
          <button id="demo-start" type="button">Start Demo</button>
          <span id="serial-status">Serial: not connected</span>
          <span id="sensor-status">Light: -- | Slider: --</span>
        </div>
        <div id="hint">
          Keyboard fallback: Space/Enter = red continue, 1 = green choice 1, 2 = yellow choice 2, 3 = white choice 3, arrows/A/D = slider, L = covered light sensor.
        </div>
      </section>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
